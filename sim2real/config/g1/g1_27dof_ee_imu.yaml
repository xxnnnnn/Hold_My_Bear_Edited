## SIM
DOMAIN_ID: 0
INTERFACE: "lo" #enp8s0
FREE_BASE: True
PRINT_SCENE_INFORMATION: True
ENABLE_ELASTIC_BAND: True

SIMULATE_DT: 0.005
VIEWER_DT: 0.02
USE_SENSOR: False

USE_JOYSTICK: 0
